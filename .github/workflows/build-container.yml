name: Build and publish container

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag or full commit SHA to build"
        required: true
        type: string
      release_channel:
        description: "Release channel used as Docker tag prefix"
        required: true
        type: choice
        options:
          - main
      allow_non_main_source:
        description: "Allow a commit from a non-main repository branch"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Validate source ref and release channel
        id: release
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          ALLOW_NON_MAIN_SOURCE: ${{ inputs.allow_non_main_source }}
        run: |
          set -Eeuo pipefail

          if [[ "$RELEASE_CHANNEL" != "main" ]]; then
            printf 'ERROR: client publishing currently supports only the main release channel\n' >&2
            exit 1
          fi

          if [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{7,39}$ ]]; then
            printf 'ERROR: abbreviated commit SHA is not allowed; use the full commit SHA\n' >&2
            exit 1
          fi

          git fetch --no-tags origin \
            '+refs/heads/*:refs/remotes/origin/*'

          built_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          created_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          registry_image="$(
            printf 'ghcr.io/%s/client' "$GITHUB_REPOSITORY_OWNER" \
              | tr '[:upper:]' '[:lower:]'
          )"

          [[ "$registry_image" == 'ghcr.io/soundinfluencers/client' ]] || {
            printf 'ERROR: workflow must run in soundinfluencers/client\n' >&2
            exit 1
          }

          source_scope=""
          source_branches=""
          publish_channel_alias="true"

          if git merge-base --is-ancestor "$built_sha" origin/main; then
            source_scope="main"
            source_branches="main"
          else
            if [[ "$ALLOW_NON_MAIN_SOURCE" != "true" ]]; then
              printf 'ERROR: commit %s is not in origin/main. Set allow_non_main_source=true for an explicit manual feature build.\n' \
                "$built_sha" >&2
              exit 1
            fi

            mapfile -t containing_branches < <(
              git for-each-ref \
                --contains "$built_sha" \
                --format='%(if)%(symref)%(then)%(else)%(refname:strip=3)%(end)' \
                refs/remotes/origin |
                awk 'NF'
            )

            if ((${#containing_branches[@]} == 0)); then
              printf 'ERROR: commit %s is not reachable from any origin branch\n' \
                "$built_sha" >&2
              exit 1
            fi

            source_scope="feature"
            source_branches="$(IFS=,; printf '%s' "${containing_branches[*]}")"
            publish_channel_alias="false"
          fi

          {
            printf 'built_sha=%s\n' "$built_sha"
            printf 'short_sha=%s\n' "$short_sha"
            printf 'created_at=%s\n' "$created_at"
            printf 'registry_image=%s\n' "$registry_image"
            printf 'immutable_tag=main-%s\n' "$short_sha"
            printf 'release_channel=main\n'
            printf 'source_scope=%s\n' "$source_scope"
            printf 'source_branches=%s\n' "$source_branches"
            printf 'publish_channel_alias=%s\n' "$publish_channel_alias"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: u/package-lock.json

      - name: Install dependencies
        working-directory: u
        run: npm ci

      - name: Build production application
        working-directory: u
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.release.outputs.registry_image }}
          tags: |
            type=raw,value=${{ steps.release.outputs.immutable_tag }}
            type=raw,value=${{ steps.release.outputs.release_channel }},enable=${{ steps.release.outputs.publish_channel_alias == 'true' }}
          labels: |
            org.opencontainers.image.title=SoundInfluencers Client
            org.opencontainers.image.description=Production client SPA for SoundInfluencers
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.built_sha }}
            org.opencontainers.image.created=${{ steps.release.outputs.created_at }}
            org.opencontainers.image.version=${{ steps.release.outputs.immutable_tag }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write publication summary
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          ALLOW_NON_MAIN_SOURCE: ${{ inputs.allow_non_main_source }}
          BUILT_SHA: ${{ steps.release.outputs.built_sha }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
          REGISTRY_IMAGE: ${{ steps.release.outputs.registry_image }}
          IMMUTABLE_TAG: ${{ steps.release.outputs.immutable_tag }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.release_channel }}
          SOURCE_SCOPE: ${{ steps.release.outputs.source_scope }}
          SOURCE_BRANCHES: ${{ steps.release.outputs.source_branches }}
          PUBLISH_CHANNEL_ALIAS: ${{ steps.release.outputs.publish_channel_alias }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ "$PUBLISH_CHANNEL_ALIAS" == "true" ]]; then
            alias_published="yes"
          else
            alias_published="no"
          fi

          {
            printf '## Published container image\n\n'
            printf -- '- Repository: %s\n' "$GITHUB_REPOSITORY"
            printf -- '- Source ref input: %s\n' "$SOURCE_REF"
            printf -- '- Source commit: %s\n' "$BUILT_SHA"
            printf -- '- Source branch: %s\n' "$SOURCE_BRANCHES"
            printf -- '- Source scope: %s\n' "$SOURCE_SCOPE"
            printf -- '- allow_non_main_source: %s\n' "$ALLOW_NON_MAIN_SOURCE"
            printf -- '- Release channel: %s\n' "$RELEASE_CHANNEL"
            printf -- '- Full SHA: %s\n' "$BUILT_SHA"
            printf -- '- Short SHA: %s\n' "$SHORT_SHA"
            printf -- '- Immutable image: %s:%s\n' "$REGISTRY_IMAGE" "$IMMUTABLE_TAG"
            printf -- '- Digest: %s\n' "$IMAGE_DIGEST"
            printf -- '- Mutable alias published: %s\n' "$alias_published"
            printf '\n```dotenv\n'
            printf 'CLIENT_IMAGE=%s:%s\n' "$REGISTRY_IMAGE" "$IMMUTABLE_TAG"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
